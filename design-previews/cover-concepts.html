<script>
(() => {
  const root = document.getElementById("month-end-cover-lab");
  const state = { concept: "a", titleScale: 1, accent: "#f5c84c" };
  const tabs = [...root.querySelectorAll(".concept-tab")];
  const screens = [...root.querySelectorAll(".concept")];

  function render() {
    root.style.setProperty("--title-scale", String(state.titleScale));
    root.style.setProperty("--lab-accent", state.accent);
    tabs.forEach(tab => {
      const active = tab.dataset.concept === state.concept;
      tab.classList.toggle("is-active", active);
      tab.setAttribute("aria-selected", String(active));
    });
    screens.forEach(screen => {
      const active = screen.dataset.screen === state.concept;
      screen.hidden = !active;
      screen.classList.toggle("is-active", active);
    });
  }

  tabs.forEach(tab => tab.addEventListener("click", () => {
    state.concept = tab.dataset.concept;
    render();
    if (window.openai?.setWidgetState) {
      window.openai.setWidgetState({ modelContent: { selectedCover: state.concept }, privateContent: state }).catch(() => {});
    }
  }));

  const saved = window.openai?.widgetState?.privateContent;
  if (saved && ["a","b","c"].includes(saved.concept)) Object.assign(state, saved);
  window.addEventListener("openai:set_globals", event => {
    const next = event.detail?.globals?.widgetState?.privateContent;
    if (next && ["a","b","c"].includes(next.concept)) { Object.assign(state, next); render(); }
  });
  render();

  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: render });
    tweak.addSelect(state, "concept", { label: "封面方向", options: [
      { label: "小镇电影海报", value: "a" },
      { label: "温暖小窝", value: "b" },
      { label: "复古游戏盒", value: "c" }
    ]});
    tweak.addSlider(state, "titleScale", { label: "标题比例", min: .85, max: 1.12, step: .01 });
    tweak.addColorPicker(state, "accent", { label: "强调色", reference: "--lab-accent" });
  }
})();
</script>
