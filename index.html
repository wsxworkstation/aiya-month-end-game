<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#73bee6">
  <title>哎呀，又月底了呀</title>
  <link rel="stylesheet" href="styles.css?v=25">
</head>
<body>
  <main id="app" aria-label="哎呀，又月底了呀游戏">
    <section id="title-screen" class="screen title-screen">
      <div class="title-art" aria-hidden="true"></div>
      <div class="title-light" aria-hidden="true"></div>
      <div class="title-sparkles" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="title-layout">
        <div class="title-badge" aria-label="十二个月，别破产">
          <strong>12</strong><span>个月 · 别破产</span>
        </div>
        <div class="title-lockup">
          <h1><small>哎呀！</small><span>又月底了呀</span></h1>
          <p class="subtitle">跑过今天，付掉房租，明天继续。</p>
        </div>
        <div class="title-actions">
          <button id="new-game-btn" class="title-button title-button-main">
            <span class="button-copy"><b>开始新生活</b><small>从第 1 月出发</small></span><span class="button-arrow">→</span>
          </button>
          <button id="resume-btn" class="title-button title-button-save" hidden>
            <span class="button-icon">↻</span><span class="button-copy"><b>继续游戏</b><small>回到刚才的月份</small></span>
          </button>
          <button id="collection-btn" class="title-button title-button-book">
            <span class="button-icon">▦</span><span class="button-copy"><b>卡片图鉴</b><small>看看收集进度</small></span>
          </button>
        </div>
        <p class="controls-hint"><span>WASD</span> 走路 <i></i> <span>E</span> 互动</p>
      </div>
    </section>

    <section id="game-screen" class="screen game-screen" hidden>
      <header class="hud" aria-label="游戏状态">
        <div class="hud-brand">
          <strong id="month-label">第1月</strong>
        </div>
        <div class="hud-stats">
          <div class="hud-stat wallet"><span>钱包</span><strong id="wallet-label">$500</strong></div>
          <div class="hud-stat bank"><span>银行</span><strong id="bank-label">$0</strong></div>
          <div class="hud-stat motivation"><span>动力</span><strong id="motivation-label">60</strong></div>
          <div class="hud-stat luck"><span>幸运</span><strong id="luck-label">50 · 普通</strong></div>
          <div class="hud-stat debt" id="debt-tile" hidden><span>债务</span><strong id="debt-label">$0</strong></div>
        </div>
        <div class="hud-actions">
          <button id="bag-btn" class="icon-btn" aria-label="打开背包">🎒<span id="bag-count">0</span></button>
          <button id="audio-btn" class="icon-btn" aria-label="切换声音">🔊</button>
          <button id="help-btn" class="icon-btn" aria-label="查看帮助">?</button>
        </div>
      </header>

      <div class="game-stage">
        <canvas id="game-canvas" width="960" height="540" aria-label="8-bit小镇游戏地图"></canvas>
        <div id="location-label" class="location-label">巴生小镇</div>
        <button id="interaction-hint" class="interaction-hint" hidden>进去</button>
        <div id="counter-bar" class="counter-bar" hidden>
          <p id="counter-who" class="counter-who"></p>
          <p id="counter-line" class="counter-line"></p>
          <div class="counter-actions">
            <button id="counter-act" class="pixel-btn primary">办事</button>
            <button id="counter-leave" class="pixel-btn ghost">离开</button>
          </div>
        </div>
      </div>

      <aside class="month-checklist" aria-label="本月事项">
        <strong>本月</strong>
        <span id="check-work">□ 工作</span>
        <span id="check-food">□ 吃饭</span>
        <span id="check-fun">□ 娱乐</span>
        <span id="check-roi">□ ROI</span>
      </aside>

      <div class="mobile-controls" aria-label="手机控制器">
        <div class="dpad">
          <button data-move="up" aria-label="向上">▲</button>
          <button data-move="left" aria-label="向左">◀</button>
          <button data-move="down" aria-label="向下">▼</button>
          <button data-move="right" aria-label="向右">▶</button>
        </div>
        <button id="mobile-action" class="action-button inactive" aria-label="点击互动">Click</button>
      </div>
    </section>

    <section id="end-screen" class="screen end-screen" hidden>
      <div class="ending-card pixel-panel">
        <p id="ending-kicker" class="eyebrow">12个月结束</p>
        <h2 id="ending-title">月底幸存者</h2>
        <div id="ending-art" class="ending-art" aria-hidden="true">💰</div>
        <p id="ending-message"></p>
        <div class="ending-total"><span>最终总资产</span><strong id="ending-assets">$0</strong></div>
        <button id="restart-btn" class="pixel-btn primary">再活一次</button>
        <button id="ending-collection-btn" class="pixel-btn ghost">查看图鉴</button>
      </div>
    </section>
  </main>

  <!-- Outside #game-screen on purpose: .screen is position:fixed, which makes its own
       stacking context, so a toast inside it can never paint above the modal layer. -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="modal-layer" class="modal-layer" hidden>
    <div id="modal" class="modal pixel-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" class="modal-close" aria-label="关闭">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <template id="card-template">
    <button class="game-card">
      <span class="card-icon"></span>
      <strong class="card-title"></strong>
      <span class="card-copy"></span>
      <span class="card-meta"></span>
    </button>
  </template>

  <script src="title-cover.js?v=1"></script>
  <script src="game.js?v=23"></script>
</body>
</html>
